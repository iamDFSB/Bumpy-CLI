site_name: Bumpy-CLI
site_url: !ENV READTHEDOCS_CANONICAL_URL
site_description: Documentação do gerenciador de versões de jobs por ambiente
site_author: Daniel Felipe Santana Batista
repo_url: https://github.com/iamDFSB/Bumpy-CLI
repo_name: iamDFSB/Bumpy-CLI
edit_uri: edit/main/docs

nav:
  - Início: index.md
  - Instalação e uso: guia-de-uso.md
  - Regras de versão: regras-de-versionamento.md

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    primary: deep purple
    accent: purple

plugins:
  - search

extra_css:
  - assets/styles/index.css