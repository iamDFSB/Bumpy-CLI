[project]
name = "bumpy-cli"
version = "0.1.0"
description = ""
authors = [
    {name = "Daniel Felipe Santana Batista",email = "daniel.sbatista@shopee.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click (>=8.5.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "bumpy.py" }]

[tool.poetry.scripts]
bumpy = "bumpy:cli" # entrypoint to the cli

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "blue (>=0.9.1,<0.10.0)",
    "isort (>=9.0.1,<10.0.0)"
]
doc = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.0,<10.0)",
    "mkdocstrings (>=1.0.6,<2.0.0)",
    "mkdocstrings-python (>=2.0.9,<3.0.0)"
]
