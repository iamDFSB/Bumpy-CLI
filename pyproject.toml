[project]
name = "bumpy-cli"
version = "0.1.0"
description = ""
authors = [
    {name = "Daniel Felipe Santana Batista",email = "daniel.sbatista@shopee.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click (>=8.5.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "bumpy.py" }]

[tool.poetry.scripts]
bumpy = "bumpy:cli" # entrypoint to the cli
