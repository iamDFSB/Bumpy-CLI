[project]
name = "bumpy-cli"
version = "0.1.0"
description = "CLI para gerenciar versoes de jobs em pipelines."
authors = [
    {name = "Daniel Felipe Santana Batista",email = "daniel.sbatista@shopee.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["cli", "pipeline", "versionamento", "jobs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Natural Language :: Portuguese (Brazilian)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer (>=0.27.2,<0.28.0)"
]

[project.urls]
Homepage = "https://github.com/iamDFSB/Bumpy-CLI"
Repository = "https://github.com/iamDFSB/Bumpy-CLI"
Documentation = "https://bumpy-cli.readthedocs.io/pt-br/latest/"

[project.scripts]
bumpy = "bumpy.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "bumpy", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "blue (>=0.9.1,<0.10.0)",
    "isort (>=9.0.1,<10.0.0)"
]
doc = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.0,<10.0)",
    "mkdocstrings (>=1.0.6,<2.0.0)",
    "mkdocstrings-python (>=2.0.9,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
line_length = 79